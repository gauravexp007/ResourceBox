<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResourceBox — Rent, Share & Exchange</title>
    <meta name="description" content="Local community marketplace to rent out unused resources, earn extra income, and exchange items with neighbors." />
    <meta property="og:title" content="ResourceBox — Rent, Share & Exchange" />
    <meta property="og:description" content="Local community marketplace to rent out unused resources, earn extra income, and exchange items with neighbors." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Lexend:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;0,900;1,600;1,700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      @font-face {
        font-family: 'Storm Gust';
        src: local('Storm Gust'), local('StormGust'), local('Metal Mania'), local('Creepster');
        font-weight: 700 900;
        font-style: normal;
      }
      .font-storm-gust {
        font-family: 'Storm Gust', 'Metal Mania', 'Rubik Glitch', 'Creepster', 'Impact', sans-serif;
      }
      @keyframes pre-shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(200%); }
      }
      .pre-skeleton {
        position: relative;
        overflow: hidden;
        background: rgba(155, 126, 189, 0.14);
      }
      .pre-skeleton::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent);
        animation: pre-shimmer 1.8s infinite;
      }
    </style>
  </head>
  <body class="bg-[#EEEEEE] text-[#3B1E54] font-sans antialiased selection:bg-[#9B7EBD] selection:text-white">
    <div id="root">
      <!-- Pre-hydration Skeleton Loader Preview (Shown instantaneously before bundle loads) -->
      <div style="min-height: 100vh; background: #EEEEEE; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <!-- Navbar Skeleton -->
        <div style="height: 64px; background: rgba(255,255,255,0.85); border-bottom: 1px solid rgba(212,190,228,0.5); display: flex; align-items: center; justify-content: space-between; padding: 0 24px;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <div class="pre-skeleton" style="width: 40px; height: 40px; border-radius: 12px; background: #3B1E54;"></div>
            <div style="display: flex; flex-direction: column; gap: 6px;">
              <div class="pre-skeleton" style="width: 120px; height: 16px; border-radius: 6px;"></div>
              <div class="pre-skeleton" style="width: 70px; height: 10px; border-radius: 4px;"></div>
            </div>
          </div>
          <div style="display: flex; gap: 10px;">
            <div class="pre-skeleton" style="width: 80px; height: 32px; border-radius: 10px;"></div>
            <div class="pre-skeleton" style="width: 90px; height: 32px; border-radius: 10px;"></div>
            <div class="pre-skeleton" style="width: 36px; height: 36px; border-radius: 50%;"></div>
          </div>
        </div>

        <!-- Hero Section Skeleton -->
        <div style="max-width: 1200px; margin: 40px auto; padding: 0 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 40px; align-items: center;">
          <div style="display: flex; flex-direction: column; gap: 20px;">
            <div class="pre-skeleton" style="width: 200px; height: 14px; border-radius: 20px;"></div>
            <div style="display: flex; flex-direction: column; gap: 10px;">
              <div class="pre-skeleton" style="width: 90%; height: 44px; border-radius: 12px;"></div>
              <div class="pre-skeleton" style="width: 80%; height: 44px; border-radius: 12px; background: rgba(155,126,189,0.35);"></div>
              <div class="pre-skeleton" style="width: 80%; height: 4px; border-radius: 4px; background: #9B7EBD;"></div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px;">
              <div class="pre-skeleton" style="width: 100%; height: 14px; border-radius: 6px;"></div>
              <div class="pre-skeleton" style="width: 75%; height: 14px; border-radius: 6px;"></div>
            </div>
            <div style="display: flex; gap: 12px; margin-top: 10px;">
              <div class="pre-skeleton" style="width: 130px; height: 42px; border-radius: 12px; background: #fff;"></div>
              <div class="pre-skeleton" style="width: 140px; height: 42px; border-radius: 12px;"></div>
              <div class="pre-skeleton" style="width: 150px; height: 42px; border-radius: 12px; background: #3B1E54;"></div>
            </div>
          </div>

          <!-- 3D Box Hub Skeleton -->
          <div style="display: flex; justify-content: center;">
            <div class="pre-skeleton" style="width: 320px; height: 320px; border-radius: 28px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(0,0,0,0.06); border: 1px solid rgba(212,190,228,0.5);">
              <div class="pre-skeleton" style="width: 140px; height: 140px; border-radius: 20px; background: #3B1E54;"></div>
            </div>
          </div>
        </div>

        <!-- Category Bar Skeleton -->
        <div style="background: rgba(255,255,255,0.7); border-top: 1px solid rgba(212,190,228,0.4); border-bottom: 1px solid rgba(212,190,228,0.4); padding: 18px 24px;">
          <div style="max-width: 1200px; margin: 0 auto; display: flex; gap: 12px; overflow: hidden;">
            <div class="pre-skeleton" style="width: 90px; height: 36px; border-radius: 12px; background: #9B7EBD;"></div>
            <div class="pre-skeleton" style="width: 120px; height: 36px; border-radius: 12px;"></div>
            <div class="pre-skeleton" style="width: 100px; height: 36px; border-radius: 12px;"></div>
            <div class="pre-skeleton" style="width: 130px; height: 36px; border-radius: 12px;"></div>
            <div class="pre-skeleton" style="width: 110px; height: 36px; border-radius: 12px;"></div>
            <div class="pre-skeleton" style="width: 95px; height: 36px; border-radius: 12px;"></div>
          </div>
        </div>

        <!-- Cards Grid Skeleton -->
        <div style="max-width: 1200px; margin: 30px auto; padding: 0 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px;">
          <div class="pre-skeleton" style="height: 320px; border-radius: 24px; background: #fff; border: 1px solid rgba(212,190,228,0.4);"></div>
          <div class="pre-skeleton" style="height: 320px; border-radius: 24px; background: #fff; border: 1px solid rgba(212,190,228,0.4);"></div>
          <div class="pre-skeleton" style="height: 320px; border-radius: 24px; background: #fff; border: 1px solid rgba(212,190,228,0.4);"></div>
          <div class="pre-skeleton" style="height: 320px; border-radius: 24px; background: #fff; border: 1px solid rgba(212,190,228,0.4);"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
